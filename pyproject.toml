[project]
name = "taxcorpus"
version = "0.1.0"
description = "Корпус налогового права РФ: структурный парсер НК РФ, канонические ID, извлечение ссылок"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
agent = [
    "anthropic>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
semantic = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
workspace = [
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxcorpus = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
